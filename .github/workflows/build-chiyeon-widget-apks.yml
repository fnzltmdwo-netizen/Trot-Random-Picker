name: Build Chiyeon Widget APKS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ChiyeonComfortWidget*.zip'
      - 'chiyeon_widget_build/patch_v142_backup_restore.py'
      - 'chiyeon_widget_build/fix_v142_java_strings.py'
      - '.github/workflows/build-chiyeon-widget-apks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest Chiyeon project ZIP
        id: findzip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(ls -1t ChiyeonComfortWidget*.zip | head -n 1)
          test -n "$ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.findzip.outputs.zip }}" -d extracted

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Apply v1.4.2 mobile backup restore
        working-directory: ${{ steps.project.outputs.dir }}
        run: python3 "$GITHUB_WORKSPACE/chiyeon_widget_build/patch_v142_backup_restore.py"

      - name: Repair v1.4.2 Java strings
        working-directory: ${{ steps.project.outputs.dir }}
        run: python3 "$GITHUB_WORKSPACE/chiyeon_widget_build/fix_v142_java_strings.py"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Restore persistent Chiyeon signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chiyeon-widget-persistent-debug-signing-v1

      - name: Ensure signing key
        shell: bash
        run: |
          set -e
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Chiyeon Widget Debug,O=Mandarin,C=KR'
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Create SAI APKS
        shell: bash
        run: |
          set -e
          APK_FILE=$(find "${{ steps.project.outputs.dir }}" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)
          test -n "$APK_FILE"
          mkdir -p release sai_pack
          cp "$APK_FILE" release/ChiyeonComfortWidget-v1.4.2.apk
          cp "$APK_FILE" sai_pack/base.apk
          printf '%s\n' '{"export_timestamp":0,"label":"치연의 위로 시계","package":"com.mandarin.chiyeonwidget","version_code":19,"version_name":"1.4.2"}' > sai_pack/meta.sai_v1.json
          (cd sai_pack && zip -q "$GITHUB_WORKSPACE/release/ChiyeonComfortWidget-v1.4.2.apks" base.apk meta.sai_v1.json)
          unzip -t release/ChiyeonComfortWidget-v1.4.2.apks

      - name: Upload APKS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiyeonComfortWidget-v1.4.2-APKS
          path: release/ChiyeonComfortWidget-v1.4.2.apks
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK backup
        uses: actions/upload-artifact@v4
        with:
          name: ChiyeonComfortWidget-v1.4.2-APK
          path: release/ChiyeonComfortWidget-v1.4.2.apk
          if-no-files-found: error
          retention-days: 30
